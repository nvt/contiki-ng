# Fuzz the MQTT engine by injecting what a broker would send, at the socket
# callback that MQTT registers for itself.
#
# The input is a sequence, because the messages that carry the most parsing
# only mean something once the connection has been accepted. A CONNACK first
# takes the connection there through the engine's own code, and what follows
# is parsed against it.
FUZZ_ENTRY_POINT=mqtt
FUZZ_PROTOCOLS="mqtt"
FUZZ_SEQUENCE=1
FUZZ_DICTIONARY=mqtt.dict
