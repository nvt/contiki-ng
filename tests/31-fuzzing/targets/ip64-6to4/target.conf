# Fuzz the translation of a packet leaving the IPv6 network.
#
# The gateway keeps a map of the connections it has translated, and this is
# the direction that creates an entry in it, so a campaign reaches the
# allocation of a mapped port as well as the rewriting of the headers.
FUZZ_ENTRY_POINT=ip64-6to4
FUZZ_PROTOCOLS="ip64"
FUZZ_DICTIONARY=ip.dict
