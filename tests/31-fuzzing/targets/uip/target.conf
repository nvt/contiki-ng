# Fuzz the IPv6 input path, including extension header processing, by
# injecting a complete IPv6 packet.
#
# The oracle checks that what the stack makes of the input does not depend
# on what the buffer held before it, in the packets it delivers and in the
# packets it sends.
FUZZ_ENTRY_POINT=uip
FUZZ_PROTOCOLS=""
FUZZ_DICTIONARY=rpl.dict
FUZZ_ORACLE=1
