# Fuzz the 6LoWPAN adaptation layer by injecting the payload of an 802.15.4
# frame, which reaches IPHC header decompression, next header compression,
# and the IPv6 input path behind them.
#
# The adaptation layer is initialized first, so that address contexts are
# configured, and the frame is given the link layer addresses of a neighbour
# sending to this node, which stateless address compression is derived from.
#
# The oracle checks that what the stack makes of the input does not depend
# on what the buffer held before it, in the packets it delivers and in the
# packets it sends.
FUZZ_ENTRY_POINT=sicslowpan
FUZZ_PROTOCOLS=""
FUZZ_DICTIONARY=sicslowpan.dict
FUZZ_ORACLE=1
