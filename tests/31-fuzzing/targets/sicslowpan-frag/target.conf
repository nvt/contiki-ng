# Fuzz 6LoWPAN fragment reassembly. A packet is only reassembled from several
# frames, so the input is a sequence of fragments delivered to the adaptation
# layer in order, all from the same neighbour.
#
# The oracle checks that the packet delivered to the IP layer does not depend
# on what the buffer it was decompressed into held before.
FUZZ_ENTRY_POINT=sicslowpan
FUZZ_PROTOCOLS=""
FUZZ_DICTIONARY=sicslowpan.dict
FUZZ_SEQUENCE=1
FUZZ_ORACLE=1
