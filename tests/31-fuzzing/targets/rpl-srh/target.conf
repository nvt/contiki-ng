# Fuzz the source routing header that a packet carries through a non-storing
# network (RFC 6554). The header is rewritten on every node it passes, which
# is why it is fuzzed at the IPv6 entry point rather than at ICMPv6: what the
# node makes of it is the packet it forwards.
#
# The code is only compiled in non-storing mode, so the harness is built for
# it. A node needs no DAG to process the header.
#
# The oracle checks that what the stack makes of the input does not depend
# on what the buffer held before it, in the packets it delivers and in the
# packets it sends.
FUZZ_ENTRY_POINT=uip
FUZZ_PROTOCOLS=""
FUZZ_DEFINES="RPL_CONF_MOP=RPL_MOP_NON_STORING"
FUZZ_DICTIONARY=srh.dict
FUZZ_ORACLE=1
