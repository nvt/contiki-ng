# Fuzz the DNS64 translation of a response from the IPv4 side, which is the
# direction that reads what an address beyond the gateway sent.
#
# Each A record becomes an AAAA record, so the message grows as it is
# rewritten and the output stops tracking the input. What the translation is
# given is what the gateway gives it: the response, a buffer that already
# holds a copy of it, and the size of that buffer.
FUZZ_ENTRY_POINT=nat64-dns64-4to6
FUZZ_PROTOCOLS="nat64-dns64"
FUZZ_DICTIONARY=dns.dict
