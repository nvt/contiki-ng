# Fuzz the parsing of destination advertisements, which only a root reaches.
# The node is made a root before any input is injected, through the routing
# interface rather than by the harness assembling RPL state itself.
#
# The oracle checks that what the stack makes of the input does not depend
# on what the buffer held before it, in the packets it delivers and in the
# packets it sends.
FUZZ_ENTRY_POINT=icmpv6-rpl-root
FUZZ_PROTOCOLS=""
FUZZ_DICTIONARY=rpl.dict
FUZZ_ORACLE=1
