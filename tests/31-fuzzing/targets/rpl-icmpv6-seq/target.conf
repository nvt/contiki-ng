# Fuzz the RPL control message parsers that only become reachable once the
# node has joined a DAG. The input is a sequence of messages, so the DAG is
# established by the messages that precede the one under test rather than by
# the harness assembling RPL state itself.
FUZZ_ENTRY_POINT=icmpv6
FUZZ_PROTOCOLS=""
FUZZ_DICTIONARY=rpl.dict
FUZZ_SEQUENCE=1
