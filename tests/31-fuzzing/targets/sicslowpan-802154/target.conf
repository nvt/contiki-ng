# Fuzz the 802.15.4 frame parser and the adaptation layer behind it by
# injecting a complete frame without its checksum. The link layer addresses
# that address decompression uses come from the parsed header rather than from
# the harness.
#
# The oracle checks that what the stack makes of the input does not depend
# on what the buffer held before it, in the packets it delivers and in the
# packets it sends.
FUZZ_ENTRY_POINT=sicslowpan-802154
FUZZ_PROTOCOLS=""
FUZZ_DICTIONARY=sicslowpan.dict
FUZZ_ORACLE=1
