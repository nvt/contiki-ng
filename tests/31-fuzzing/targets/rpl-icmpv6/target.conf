# Fuzz the RPL control message parsers by injecting at the ICMPv6 layer,
# which avoids having to satisfy the IPv6 header checks on every input.
#
# The oracle checks that what the stack makes of the input does not depend
# on what the buffer held before it, in the packets it delivers and in the
# packets it sends.
FUZZ_ENTRY_POINT=icmpv6
FUZZ_PROTOCOLS=""
FUZZ_DICTIONARY=rpl.dict
FUZZ_ORACLE=1
