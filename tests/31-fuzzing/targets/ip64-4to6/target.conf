# Fuzz the translation of a packet arriving from the IPv4 side, which is the
# direction that reads what an address beyond the gateway sent.
#
# A packet is translated against the connection map, which is looked up on a
# port taken from the packet itself.
FUZZ_ENTRY_POINT=ip64-4to6
FUZZ_PROTOCOLS="ip64"
FUZZ_DICTIONARY=ip.dict
