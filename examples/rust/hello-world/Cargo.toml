[package]
name = "hello-world"
version = "0.1.0"
edition = "2021"

[lib]
name = "hello_world_process"
path = "hello_world_process.rs"
crate-type = ["staticlib"]

[dependencies]
# Use the contiki-sys library from tools/rust-support
contiki-sys = { path = "../../../tools/rust-support" }

[profile.release]
opt-level = "s"     # Optimize for size
lto = true          # Enable Link Time Optimization
panic = "abort"     # Don't include unwinding code
codegen-units = 1   # Single codegen unit for better optimization

[profile.dev]
panic = "abort"     # Even in dev, we can't unwind in embedded
